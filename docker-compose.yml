services:
  # ========================================================
  # 1. MongoDB Database (with single-node Replica Set for ACID transactions)
  # ========================================================
  mongodb:
    image: mongo:7.0
    container_name: ledger-mongodb
    restart: unless-stopped
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all", "--port", "27017"]
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - ledger-network
    healthcheck:
      test: echo "try { rs.status().ok } catch(e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'mongodb:27017'}]}).ok }" | mongosh --port 27017 --quiet
      interval: 5s
      timeout: 10s
      retries: 10
      start_period: 5s

  # ========================================================
  # 2. MongoDB Replica Set Initializer
  # ========================================================
  mongo-init:
    image: mongo:7.0
    container_name: ledger-mongo-init
    restart: "no"
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - ledger-network
    entrypoint: >
      mongosh --host mongodb:27017 --eval '
        try {
          const status = rs.status();
          if (status.ok) {
            console.log("Replica set rs0 is already initialized and active.");
          }
        } catch (e) {
          console.log("Initializing replica set rs0...");
          rs.initiate({
            _id: "rs0",
            members: [{ _id: 0, host: "mongodb:27017" }]
          });
          console.log("Replica set rs0 initialized successfully.");
        }
      '

  # ========================================================
  # 3. Redis In-Memory Distributed Lock & Idempotency Cache
  # ========================================================
  redis:
    image: redis:7-alpine
    container_name: ledger-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - ledger-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ========================================================
  # 4. Backend Express API
  # ========================================================
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ledger-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - MONGO_URI=mongodb://mongodb:27017/ledgerline?replicaSet=rs0&directConnection=true
      - REDIS_URI=redis://redis:6379
      - JWT_SECRET=docker-compose-production-jwt-secret-key-32-chars
      - FRONTEND_URL=http://localhost,http://localhost:80,http://127.0.0.1,http://localhost:5173
    depends_on:
      mongodb:
        condition: service_healthy
      mongo-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks:
      - ledger-network

  # ========================================================
  # 5. Frontend React SPA (Served via Nginx Reverse Proxy)
  # ========================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ledger-frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "5173:80"
    depends_on:
      - backend
    networks:
      - ledger-network

volumes:
  mongo-data:
    driver: local
  redis-data:
    driver: local

networks:
  ledger-network:
    driver: bridge
